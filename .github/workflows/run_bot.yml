name: ETIAS Bot - Daily Post

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Without this, an overlapping manual dispatch during the daily cron run
# would let two processes each read their own checkout of
# posted_articles.json, neither seeing the other's in-flight publish -- the
# exact same-title-published-twice failure mode the scheduler.py dedup fix
# (audit 2026-07-10) targets, just re-opened at the workflow level instead
# of the code level.
concurrency:
  group: etias-bot-publish
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -q

      - name: Run bot
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # exit(1) only on "every candidate failed" -- "no_candidates" (a
        # normal day with nothing new to publish) stays success so it
        # doesn't trip the alert step below on ordinary quiet days.
        run: |
          python -c "
          from scheduler import run_daily_job
          import sys
          outcome = run_daily_job()
          sys.exit(1 if outcome == 'all_failed' else 0)
          "

      # Always run, even if "Run bot" failed -- a day with zero commits (e.g.
      # an unhandled crash before last_run.json is written) is exactly the
      # silent-failure pattern from the 2026-07 audit, and after ~60 days of
      # zero repo activity GitHub auto-disables the scheduled trigger.
      - name: Save state
        if: always()
        run: |
          git config user.email "bot@etiaseuropa.eu"
          git config user.name "ETIAS Bot"
          git add posted_articles.json
          git add last_run.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "bot: update posted articles [skip ci]"
            git push
          else
            echo "No state changes to commit"
          fi

      - name: Alert on failure
        # A step's own env: block is NOT visible in that same step's if:
        # (only job/workflow-level env is) -- must reference secrets.* here
        # directly, otherwise this condition is permanently false regardless
        # of whether the secret is configured.
        if: failure() && secrets.ALERT_WEBHOOK_URL != ''
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          curl -fsS -X POST "$ALERT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"etias-bot: run failed (run ${{ github.run_id }}) - https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
